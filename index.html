<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080314">

<title>ROSE AI Assistant</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #241044, #080314 70%);
  color: #ff72d2;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 450px;
  padding: 25px 15px;
}

h1 {
  font-size: 35px;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #ff38bd;
  margin-bottom: 5px;
}

.subtitle {
  color: #d7b5ff;
  font-size: 11px;
  letter-spacing: 4px;
}

.orb {
  width: 210px;
  height: 210px;
  margin: 30px auto;
  border: 3px solid #ff55c8;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 0 30px #ff38bd,
              inset 0 0 25px #ff38bd;
  animation: pulse 2s infinite alternate;
}

.ring {
  position: absolute;
  inset: 15px;
  border: 2px dashed #a66aff;
  border-radius: 50%;
  animation: spin 12s linear infinite;
}

.core {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, white, #ff38bd 65%);
  box-shadow: 0 0 35px #ff38bd;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#status {
  color: #ffb8e8;
  font-size: 13px;
  margin: 15px;
}

#output {
  color: white;
  min-height: 60px;
  padding: 12px;
  line-height: 1.6;
}

button {
  width: 85%;
  max-width: 280px;
  padding: 15px;
  margin: 7px;
  border: 1px solid #ff7bd6;
  border-radius: 30px;
  background: linear-gradient(90deg, #a71983, #6030b5);
  color: white;
  font-size: 14px;
  font-weight: bold;
  box-shadow: 0 0 15px #a71983;
}

button:active {
  transform: scale(0.96);
}

.footer {
  color: #a99abf;
  font-size: 11px;
  margin-top: 22px;
}
</style>
</head>

<body>

<div class="container">

  <h1>ROSE AI</h1>

  <div class="subtitle">YOUR PERSONAL ASSISTANT</div>

  <div class="orb">
    <div class="ring"></div>
    <div class="core"></div>
  </div>

  <div id="status">ROSE READY</div>

  <div id="output">
    Hello Baby Main Rose hoon.
    Bolo, kya karna hai?
  </div>

  <button onclick="startListening()">
    TALK TO ROSE
  </button>

  <button onclick="testVoice()">
     TEST MY VOICE
  </button>

  <div class="footer">
    ROSE AI • PERSONAL VOICE ASSISTANT
  </div>

</div>

<script>
const output = document.getElementById("output");
const statusText = document.getElementById("status");

let recognition = null;

function speak(message) {
  output.textContent = message;

  if (!("speechSynthesis" in window)) {
    statusText.textContent = "VOICE NOT SUPPORTED";
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(message);

  speech.lang = "hi-IN";
  speech.rate = 0.92;
  speech.pitch = 1.15;
  speech.volume = 1;

  speech.onend = function() {
    statusText.textContent = " ROSE READY";
  };

  statusText.textContent = " ROSE SPEAKING";

  window.speechSynthesis.speak(speech);
}

function testVoice() {
  speak("Yes Baby! Main Rose hoon. Bolo, kya karna hai?");
}

function startListening() {
  const SpeechAPI =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechAPI) {
    speak("Baby, voice recognition ke liye Chrome browser mein try karo.");
    return;
  }

  recognition = new SpeechAPI();

  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  statusText.textContent = " ROSE LISTENING";

  recognition.onresult = function(event) {
    const command =
      event.results[0][0].transcript.toLowerCase().trim();

    output.textContent = "You said: " + command;

    runCommand(command);
  };

  recognition.onerror = function(event) {
    statusText.textContent = " ROSE READY";

    if (event.error === "not-allowed") {
      speak("Baby, microphone permission allow karo.");
    } else {
      output.textContent =
        "Voice error: " + event.error +
        ". Dobara try karo, Baby.";
    }
  };

  recognition.onend = function() {
    if (statusText.textContent === "ROSE LISTENING") {
      statusText.textContent = "ROSE READY";
    }
  };

  try {
    recognition.start();
  } catch (error) {
    speak("Baby, thodi der baad dobara try karo.");
  }
}

function openSite(url, message) {
  speak(message);

  setTimeout(function() {
    const newWindow = window.open(url, "_blank");

    if (!newWindow) {
      output.textContent =
        "Baby, browser ne page opening block kar di. Button dobara try karo.";
    }
  }, 800);
}

function runCommand(command) {

  if (
    command.includes("hey rose") ||
    command.includes("हे रोज") ||
    command.includes("हे रोस") ||
    command.includes("हाय रोज")
  ) {
    speak("Yes Baby! Main sun rahi hoon.");
  }

  else if (
    command.includes("youtube") ||
    command.includes("यूट्यूब")
  ) {
    openSite(
      "https://m.youtube.com",
      "Okay Baby, YouTube khol rahi hoon."
    );
  }

  else if (
    command.includes("google") ||
    command.includes("गूगल")
  ) {
    openSite(
      "https://www.google.com",
      "Okay Baby, Google khol rahi hoon."
    );
  }

  else if (
    command.includes("chrome") ||
    command.includes("ब्राउज़र")
  ) {
    openSite(
      "https://www.google.com",
      "Okay Baby, browser khol rahi hoon."
    );
  }

  else if (
    command.includes("समय") ||
    command.includes("टाइम") ||
    command.includes("time")
  ) {
    const time = new Date().toLocaleTimeString("hi-IN", {
      hour: "2-digit",
      minute: "2-digit"
    });

    speak("Baby, abhi " + time + " baje hain.");
  }

  else if (
    command.includes("तारीख") ||
    command.includes("date")
  ) {
    const date = new Date().toLocaleDateString("hi-IN");

    speak("Baby, aaj ki tareekh " + date + " hai.");
  }

  else if (
    command.includes("नमस्ते") ||
    command.includes("हेलो") ||
    command.includes("hello")
  ) {
    speak("Hello Baby! Main Rose hoon.");
  }

  else if (
    command.includes("रुको") ||
    command.includes("चुप") ||
    command.includes("stop")
  ) {
    window.speechSynthesis.cancel();
    speak("Okay Baby.");
  }

  else {
    speak("Baby, ye command abhi add nahi hai.");
  }
}
</script>

</body>
</html>
